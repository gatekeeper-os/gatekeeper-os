packages:
  - "packages/*"
  - "scripts/spike-probe"

# Install-time build scripts, decided explicitly rather than left to an interactive prompt (plan §7.5).
# Only esbuild needs one: tsup cannot build without its platform binary. Everything else is present for
# type-checking or as a transitive dependency and has no reason to execute code at install time. `openclaw` is a
# development-time peer here; a cell's *runtime* install is a separate
# `npm install -g openclaw@<pin> --allow-scripts=openclaw` performed by the installer inside the VM.
allowBuilds:
  '@google/genai': false
  esbuild: true
  koffi: false
  openclaw: false
  protobufjs: false
  tree-sitter-bash: false

# Shared dependency ranges. Keep the `openclaw` peer range identical in every package that declares it
# (scripts/check-catalog.ts enforces this — see cloudflare-os-starter's catalog-drift lesson, plan §8).
catalog:
  openclaw: ">=2026.9.2 <2026.11.0"
  typebox: "1.1.39"
  typescript: "5.9.2"
  tsup: "8.5.0"
  tsx: "4.20.5"
  vitest: "3.2.4"
  eslint: "9.34.0"
  "@types/node": "22.18.0"
