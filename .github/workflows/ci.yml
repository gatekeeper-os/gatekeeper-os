name: ci
on:
  push: { branches: [main, "phase/**"] }
  pull_request:
jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh
  build-test:
    needs: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm run check:catalog
      - run: pnpm run check:secrets
      - run: node scripts/check-package-licenses.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/check-package-licenses.mjs --pack
      - run: pnpm test
      - run: pnpm exec tsx --test scripts/release.test.ts
      - run: node --test scripts/release-published.test.mjs scripts/check-secrets.test.mjs scripts/packed-load.test.mjs test/scripts/blueprint-audit-gate.test.mjs
      - name: Inspect manifests and load packed plugins with pinned upstream
        env:
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/gkos-pin-check
          OPENCLAW_CONFIG_PATH: ${{ runner.temp }}/gkos-pin-check/openclaw.json
          OPENCLAW_NO_AUTO_UPDATE: "1"
        run: |
          mkdir -p "$OPENCLAW_STATE_DIR"
          printf '{}\n' > "$OPENCLAW_CONFIG_PATH"
          pin=$(node -p "require('./gkos.lock.json').upstream.version")
          npm install -g "openclaw@$pin" --allow-scripts=openclaw
          actual=$(openclaw --version)
          printf '%s\n' "$actual"
          [[ "$actual" == "OpenClaw $pin" || "$actual" == "OpenClaw $pin "* ]]
          pnpm run validate:plugins
          node scripts/check-package-licenses.mjs --pack --validate
  node-floor:
    # Package engines stay >=22.22.3 because the declared floor (openclaw 2026.9.2) runs on Node 22.
    # The pinned upstream needs Node 24.16+, so this job builds and tests without installing it.
    needs: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.22.3", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
