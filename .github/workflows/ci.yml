name: ci
on:
  push: { branches: [main, "phase/**"] }
  pull_request:
jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-secrets.sh
  build-test:
    needs: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm run check:catalog
      - run: pnpm run check:secrets
      - run: node scripts/check-package-licenses.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - run: node scripts/check-package-licenses.mjs --pack
      - run: pnpm test
      - name: Install pinned upstream and validate plugin metadata
        env:
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/clawos-pin-check
          OPENCLAW_CONFIG_PATH: ${{ runner.temp }}/clawos-pin-check/openclaw.json
          OPENCLAW_NO_AUTO_UPDATE: "1"
        run: |
          mkdir -p "$OPENCLAW_STATE_DIR"
          printf '{}\n' > "$OPENCLAW_CONFIG_PATH"
          pin=$(node -p "require('./clawos.lock.json').upstream.version")
          npm install -g "openclaw@$pin" --allow-scripts=openclaw
          actual=$(openclaw --version)
          printf '%s\n' "$actual"
          [[ "$actual" == "OpenClaw $pin" || "$actual" == "OpenClaw $pin "* ]]
          pnpm run validate:plugins
          node scripts/check-package-licenses.mjs --pack --validate
