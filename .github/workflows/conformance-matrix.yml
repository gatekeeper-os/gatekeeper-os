name: conformance-matrix
# Compatibility smoke, not full phase acceptance; see implementation-plan.md §6.5.
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/conformance-matrix.yml", "scripts/ci/**"]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { tag: [pinned, latest, beta, extended-stable] }
    env:
      OPENCLAW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        # Rolling upstream requires >=24.16; pinned build CI retains Node 22 coverage.
        with: { node-version: "24", cache: pnpm }
      - name: Select isolated runner state
        run: |
          printf 'OPENCLAW_STATE_DIR=%s/clawos-nightly\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'OPENCLAW_CONFIG_PATH=%s/clawos-nightly/openclaw.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - run: node --test scripts/ci/report.test.mjs
      - name: Resolve upstream and declared compatibility
        id: upstream
        env:
          UPSTREAM_TAG: ${{ matrix.tag }}
        run: node scripts/ci/resolve-upstream.mjs
      - if: steps.upstream.outputs.supported == 'true'
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install exact resolved upstream in disposable runner
        if: steps.upstream.outputs.supported == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          mkdir -m 700 -p "$OPENCLAW_STATE_DIR"
          printf '{}\n' > "$OPENCLAW_CONFIG_PATH"
          chmod 600 "$OPENCLAW_CONFIG_PATH"
          npm install -g "openclaw@$UPSTREAM_VERSION" --allow-scripts=openclaw
          openclaw --version
      - name: Validate ordinary plugin metadata
        if: steps.upstream.outputs.supported == 'true'
        run: pnpm validate:plugins
      - name: Live kernel and filesystem compatibility smoke
        if: steps.upstream.outputs.supported == 'true'
        run: pnpm exec tsx scripts/ci/live-smoke.ts
      - name: Publish structural verdict
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-${{ matrix.tag }}
          path: verdict-*.json
          if-no-files-found: error
